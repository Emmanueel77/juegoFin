<meta name='viewport' content='width=device-width, initial-scale=1'/><!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz de Parábolas - Identificación de Puntos Clave</title>
  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --accent: #10b981; /* Verde esmeralda */
      --focus: #f59e0b; /* Amarillo para el foco */
      --vertex: #3b82f6; /* Azul para el vértice */
      --directrix: #f43f5e; /* Rojo para la directriz */
      --muted: #94a3b8;
      --glass: rgba(255, 255, 255, 0.04);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    
    /* ===== FONDO ANIMADO MEJORADO ===== */
    @keyframes float {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.03; }
      25% { transform: translateY(-20px) translateX(10px); opacity: 0.05; }
      50% { transform: translateY(-40px) translateX(-10px); opacity: 0.03; }
      75% { transform: translateY(-20px) translateX(20px); opacity: 0.04; }
    }
    
    @keyframes grid-pulse {
      0%, 100% { opacity: 0.08; }
      50% { opacity: 0.12; }
    }
    
    html, body {
      height: 100%;
      margin: 0;
      background: linear-gradient(180deg, #081126 0%, #071023 100%);
      color: #e6eef8;
      position: relative;
      overflow-x: hidden;
    }
    
    body::before {
      content: '';
      position: fixed;
      top: 0;
      left: 0;
      width: 200%;
      height: 200%;
      background-image: 
        linear-gradient(0deg, transparent 24%, rgba(16, 185, 129, 0.05) 25%, rgba(16, 185, 129, 0.05) 26%, transparent 27%, transparent 74%, rgba(16, 185, 129, 0.05) 75%, rgba(16, 185, 129, 0.05) 76%, transparent 77%, transparent),
        linear-gradient(90deg, transparent 24%, rgba(16, 185, 129, 0.05) 25%, rgba(16, 185, 129, 0.05) 26%, transparent 27%, transparent 74%, rgba(16, 185, 129, 0.05) 75%, rgba(16, 185, 129, 0.05) 76%, transparent 77%, transparent);
      background-size: 60px 60px;
      background-position: 0 0, 0 0;
      animation: grid-pulse 8s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    
    body::after {
      content: '';
      position: fixed;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.03) 1px, transparent 1px);
      background-size: 80px 80px;
      animation: float 20s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    
    .app {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 18px;
      min-height: 100vh;
      position: relative;
      z-index: 1;
    }
    
    .game-area {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
      width: 100%;
      max-width: 900px;
    }
    
    .panel {
      background: var(--card);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(2, 6, 23, 0.6);
    }
    
    h1 {
      margin: 0 0 10px 0;
      font-size: 24px;
      color: var(--accent);
      text-align: center;
    }
    
    /* ===== TEMPORIZADOR NUEVO ===== */
    .timer-display {
      text-align: center;
      font-size: 28px;
      font-weight: 700;
      color: var(--accent);
      margin-bottom: 15px;
      padding: 12px;
      background: rgba(16, 185, 129, 0.1);
      border-radius: 8px;
      border: 2px solid var(--accent);
      transition: all 0.3s;
    }
    
    .timer-display.warning {
      color: var(--focus);
      border-color: var(--focus);
      background: rgba(245, 158, 11, 0.1);
      animation: pulse-timer 0.5s infinite;
    }
    
    .timer-display.danger {
      color: var(--directrix);
      border-color: var(--directrix);
      background: rgba(244, 63, 94, 0.1);
      animation: pulse-timer 0.3s infinite;
    }
    
    @keyframes pulse-timer {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    
    /* ===== INDICADOR DE PROGRESO (qué elementos faltan) ===== */
    .progress-indicator {
      display: flex;
      justify-content: center;
      gap: 15px;
      margin-bottom: 15px;
      flex-wrap: wrap;
    }
    
    .progress-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      font-size: 13px;
      color: var(--muted);
      transition: all 0.3s;
    }
    
    .progress-item.completed {
      background: rgba(16, 185, 129, 0.2);
      color: var(--accent);
      font-weight: 600;
    }
    
    .progress-item.active {
      background: rgba(245, 158, 11, 0.2);
      color: var(--focus);
      font-weight: 600;
      border: 1px solid var(--focus);
    }
    
    .progress-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: currentColor;
      opacity: 0.5;
    }
    
    .progress-item.completed .progress-circle {
      opacity: 1;
    }
    
    .progress-item.active .progress-circle {
      opacity: 1;
      animation: progress-pulse 1s infinite;
    }
    
    @keyframes progress-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
    
    .instructions {
      color: var(--muted);
      margin-bottom: 20px;
      text-align: center;
    }
    
    .canvas-wrap {
      position: relative;
      border-radius: 12px;
      overflow: hidden;
      height: 450px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.02), rgba(255, 255, 255, 0.01));
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    
    .quiz-controls {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 15px;
    }
    
    .quiz-controls button {
      background: linear-gradient(180deg, var(--accent), #059669);
      border: 0;
      padding: 12px 16px;
      border-radius: 8px;
      color: #071023;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.3s;
    }
    
    .quiz-controls button:hover:not(:disabled) {
      background: var(--accent);
    }
    
    .quiz-controls button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .status-message {
      text-align: center;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
      margin-top: 15px;
      min-height: 40px;
    }
    
    .correct {
      background-color: rgba(16, 185, 129, 0.2);
      color: var(--accent);
    }
    
    .incorrect {
      background-color: rgba(244, 63, 94, 0.2);
      color: var(--directrix);
    }
    
    .score-board {
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .score-item {
      text-align: center;
    }
    
    .score-item .label {
      font-size: 14px;
      color: var(--muted);
    }
    
    .score-item .value {
      font-size: 24px;
      font-weight: 700;
      color: #fff;
    }

    .selection-buttons {
        display: flex;
        justify-content: center;
        gap: 10px;
        margin-top: 20px;
        flex-wrap: wrap;
    }
    
    .selection-buttons button {
        background-color: var(--glass);
        color: #e6eef8;
        border: 2px solid transparent;
        padding: 10px 15px;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s;
        min-width: 120px;
    }
    
    .selection-buttons button:hover:not(:disabled) {
        background-color: rgba(255, 255, 255, 0.1);
    }
    
    .selection-buttons button.selected {
        border-color: var(--accent);
        background-color: rgba(16, 185, 129, 0.1);
    }
    
    .selection-buttons button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .selection-buttons button[data-point="focus"] { border-color: var(--focus); }
    .selection-buttons button[data-point="vertex"] { border-color: var(--vertex); }
    .selection-buttons button[data-point="directrix"] { border-color: var(--directrix); }

    @media (max-width: 600px) {
        .game-area {
            grid-template-columns: 1fr;
        }
        .canvas-wrap {
            height: 350px;
        }
        .selection-buttons {
            flex-direction: column;
        }
        .timer-display {
          font-size: 24px;
        }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="game-area">
      <div class="panel">
        <h1>Identifica los Puntos Clave de la Parábola</h1>
        
        <!-- NUEVO: Temporizador global -->
        <div class="timer-display" id="timer-display">⏱️ 60s</div>
        
        <!-- NUEVO: Indicador de progreso -->
        <div class="progress-indicator" id="progress-indicator"></div>
        
        <div class="instructions">
          Observa la parábola dibujada en el plano. Identifica los 3 elementos clave: Foco, Vértice y Directriz. Completa los 3 para pasar a la siguiente parábola.
        </div>
        
        <div class="canvas-wrap">
          <canvas id="quiz-canvas"></canvas>
        </div>

        <div class="selection-buttons" id="selection-buttons">
            <button data-point="focus">Foco ($\text{F}$)</button>
            <button data-point="vertex">Vértice ($\text{V}$)</button>
            <button data-point="directrix">Directriz ($\text{D}$)</button>
        </div>

        <div class="quiz-controls">
          <button id="check-btn" disabled>Comprobar Ubicación</button>
          <button id="next-btn" style="display:none;">Siguiente Parábola</button>
          <div id="status-message" class="status-message"></div>
        </div>

        <div class="score-board">
          <div class="score-item">
            <div class="label">Rondas Completadas</div>
            <div class="value" id="correct-score">0</div>
          </div>
          <div class="score-item">
            <div class="label">Total de Intentos</div>
            <div class="value" id="attempts-score">0</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('quiz-canvas');
    const ctx = canvas.getContext('2d');
    const statusMessage = document.getElementById('status-message');
    const checkBtn = document.getElementById('check-btn');
    const nextBtn = document.getElementById('next-btn');
    const selectionButtons = document.getElementById('selection-buttons');
    const correctScoreElem = document.getElementById('correct-score');
    const attemptsScoreElem = document.getElementById('attempts-score');
    const timerDisplay = document.getElementById('timer-display');
    const progressIndicator = document.getElementById('progress-indicator');

    let W, H;
    let scale = 30;
    let centerX, centerY;
    let currentParabola = null;
    let selectedPointType = null;
    let userGuess = null;
    let quizState = 'awaiting_selection';
    let score = { correct: 0, attempts: 0 };
    const tolerance = 15;

    /* ===== SISTEMA DE TEMPORIZADOR NUEVO ===== */
    let timeRemaining = 60;
    let timerInterval = null;
    let gameOver = false;

    function startTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!gameOver) {
          timeRemaining--;
          updateTimerDisplay();
          if (timeRemaining <= 0) {
            endGame();
          }
        }
      }, 1000);
    }

    function updateTimerDisplay() {
      let color = 'neutral';
      if (timeRemaining <= 10 && timeRemaining > 5) color = 'warning';
      if (timeRemaining <= 5) color = 'danger';
      
      timerDisplay.className = 'timer-display';
      if (color !== 'neutral') timerDisplay.classList.add(color);
      timerDisplay.textContent = `⏱️ ${timeRemaining}s`;
    }

    function addTime(seconds) {
      timeRemaining = Math.min(timeRemaining + seconds, 60);
      updateTimerDisplay();
    }

    function endGame() {
      gameOver = true;
      if (timerInterval) clearInterval(timerInterval);
      statusMessage.className = 'status-message incorrect';
      statusMessage.textContent = `⏰ ¡Tiempo agotado! Completaste ${score.correct} ronda(s). Recarga para jugar de nuevo.`;
      checkBtn.style.display = 'none';
      nextBtn.style.display = 'none';
      Array.from(selectionButtons.children).forEach(btn => btn.disabled = true);
      canvas.style.pointerEvents = 'none';
    }

    /* ===== SISTEMA DE ELEMENTOS MÚLTIPLES NUEVO ===== */
    let elementsToIdentify = ['focus', 'vertex', 'directrix'];
    let identifiedElements = {}; // { 'focus': true, 'vertex': false, ... }
    let currentElementIndex = 0;

    function initElementsState() {
      identifiedElements = {
        'focus': false,
        'vertex': false,
        'directrix': false
      };
      currentElementIndex = 0;
      updateProgressIndicator();
    }

    function updateProgressIndicator() {
      progressIndicator.innerHTML = '';
      elementsToIdentify.forEach((elem, idx) => {
        const div = document.createElement('div');
        div.className = 'progress-item';
        if (identifiedElements[elem]) {
          div.classList.add('completed');
        } else if (idx === currentElementIndex) {
          div.classList.add('active');
        }
        
        const elemName = elem === 'focus' ? 'Foco' : elem === 'vertex' ? 'Vértice' : 'Directriz';
        div.innerHTML = `<div class="progress-circle"></div> ${elemName}`;
        progressIndicator.appendChild(div);
      });
    }

    function getCurrentElement() {
      return elementsToIdentify[currentElementIndex];
    }

    function moveToNextElement() {
      if (currentElementIndex < elementsToIdentify.length - 1) {
        currentElementIndex++;
        updateProgressIndicator();
        selectedPointType = null;
        userGuess = null;
        quizState = 'awaiting_selection';
        checkBtn.disabled = true;
        Array.from(selectionButtons.children).forEach(btn => {
          btn.classList.remove('selected');
          btn.disabled = false;
        });
        statusMessage.className = 'status-message';
        statusMessage.textContent = `Selecciona el siguiente elemento a identificar.`;
        draw();
        return false;
      }
      return true; // Todos completados
    }

    // --- Helpers ---

    function resizeCanvas() {
        const wrap = document.querySelector('.canvas-wrap');
        W = canvas.width = wrap.clientWidth;
        H = canvas.height = wrap.clientHeight;
        centerX = W / 2;
        centerY = H / 2;
        if (currentParabola) draw();
    }
    window.addEventListener('resize', resizeCanvas);
    
    function canvasToWorld(x, y) {
        return {
            x: (x - centerX) / scale,
            y: (centerY - y) / scale 
        };
    }

    function worldToCanvas(x, y) {
        return {
            x: x * scale + centerX,
            y: centerY - y * scale
        };
    }

    function updateScore() {
        correctScoreElem.textContent = score.correct;
        attemptsScoreElem.textContent = score.attempts;
    }

    // --- Drawing Functions ---

    function drawGrid() {
        ctx.strokeStyle = 'rgba(255,255,255,0.05)';
        ctx.lineWidth = 1;
        const step = scale; 

        for (let x = centerX % step; x < W; x += step) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, H);
            ctx.stroke();
        }
        for (let y = centerY % step; y < H; y += step) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(W, y);
            ctx.stroke();
        }

        ctx.strokeStyle = 'rgba(255,255,255,0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, centerY);
        ctx.lineTo(W, centerY);
        ctx.moveTo(centerX, 0);
        ctx.lineTo(centerX, H);
        ctx.stroke();

        ctx.fillStyle = 'rgba(255,255,255,0.5)';
        ctx.font = '12px Inter';
        ctx.fillText('(0, 0)', centerX + 5, centerY + 15);
    }

    function drawParabola(h, k, p, orientation) {
        ctx.strokeStyle = 'var(--accent)';
        ctx.lineWidth = 3;
        ctx.beginPath();

        const P_param = 4 * p;
        
        if (orientation === 'vertical') {
            for (let px = 0; px <= W; px += 1) {
                const wx = canvasToWorld(px, 0).x;
                const wy = (1 / P_param) * (wx - h) * (wx - h) + k;
                const canvasPoint = worldToCanvas(wx, wy);

                if (canvasPoint.y >= 0 && canvasPoint.y <= H) {
                    if (px === 0) {
                        ctx.moveTo(canvasPoint.x, canvasPoint.y);
                    } else {
                        ctx.lineTo(canvasPoint.x, canvasPoint.y);
                    }
                }
            }
        } else {
            for (let py = 0; py <= H; py += 1) {
                const wy = canvasToWorld(0, py).y;
                const wx = (1 / P_param) * (wy - k) * (wy - k) + h;
                const canvasPoint = worldToCanvas(wx, wy);

                if (canvasPoint.x >= 0 && canvasPoint.x <= W) {
                    if (py === 0) {
                        ctx.moveTo(canvasPoint.x, canvasPoint.y);
                    } else {
                        ctx.lineTo(canvasPoint.x, canvasPoint.y);
                    }
                }
            }
        }
        ctx.stroke();
    }
    
    function drawDirectrix(directrixEq) {
        ctx.strokeStyle = 'var(--directrix)';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);

        if (directrixEq.axis === 'y') {
            const canvas_x = worldToCanvas(directrixEq.value, 0).x;
            ctx.beginPath();
            ctx.moveTo(canvas_x, 0);
            ctx.lineTo(canvas_x, H);
            ctx.stroke();
        } else {
            const canvas_y = worldToCanvas(0, directrixEq.value).y;
            ctx.beginPath();
            ctx.moveTo(0, canvas_y);
            ctx.lineTo(W, canvas_y);
            ctx.stroke();
        }
        ctx.setLineDash([]);
    }

    function drawPoint(x, y, color, size = 6, label = '') {
        ctx.fillStyle = color;
        const p = worldToCanvas(x, y);
        ctx.beginPath();
        ctx.arc(p.x, p.y, size, 0, Math.PI * 2);
        ctx.fill();
        
        ctx.fillStyle = '#e6eef8';
        ctx.font = '14px Inter';
        if (label) {
            ctx.fillText(label, p.x + 8, p.y + 4);
        }
    }

    function draw() {
        ctx.clearRect(0, 0, W, H);
        drawGrid();

        if (currentParabola) {
            const p = currentParabola;
            drawParabola(p.h, p.k, p.p, p.orientation);
            drawDirectrix(p.directrix);

            // Dibujar guess si existe
            if (userGuess && quizState !== 'result') {
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(userGuess.canvasX, userGuess.canvasY, 8, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Mostrar resultado si aplica
            if (quizState === 'result') {
                const targetPoint = currentParabola[selectedPointType];
                const targetCanvas = worldToCanvas(targetPoint.x, targetPoint.y || targetPoint.value);
                const color = userGuess.isCorrect ? 'var(--accent)' : 'var(--directrix)';
                
                if (selectedPointType !== 'directrix') {
                    drawPoint(targetPoint.x, targetPoint.y, color, 8);
                } else {
                    drawDirectrix(p.directrix);
                }
                
                if (!userGuess.isCorrect) {
                     ctx.strokeStyle = 'yellow';
                     ctx.lineWidth = 2;
                     ctx.beginPath();
                     ctx.arc(userGuess.canvasX, userGuess.canvasY, 8, 0, Math.PI * 2);
                     ctx.stroke();
                }
            }
        }
    }

    // --- Quiz Logic ---

    function generateParabola() {
        const orientation = Math.random() < 0.5 ? 'vertical' : 'horizontal';
        const h = Math.round(Math.random() * 4) - 2;
        const k = Math.round(Math.random() * 4) - 2;
        
        let p = (Math.random() * 1.5) + 0.5;
        if (Math.random() < 0.5) p = -p; 
        p = parseFloat(p.toFixed(1)); 

        let focus, directrix;

        if (orientation === 'vertical') {
            focus = { x: h, y: k + p };
            directrix = { axis: 'x', value: k - p };
        } else {
            focus = { x: h + p, y: k };
            directrix = { axis: 'y', value: h - p };
        }
        
        focus.x = parseFloat(focus.x.toFixed(1));
        focus.y = parseFloat(focus.y.toFixed(1));
        directrix.value = parseFloat(directrix.value.toFixed(1));

        return {
            h, k, p, orientation,
            focus: focus,
            vertex: { x: h, y: k },
            directrix: directrix
        };
    }

    function startNewRound() {
        if (gameOver) return;
        
        currentParabola = generateParabola();
        initElementsState();
        selectedPointType = null;
        userGuess = null;
        quizState = 'awaiting_selection';
        statusMessage.className = 'status-message';
        statusMessage.textContent = 'Selecciona el primer elemento a identificar (Foco, Vértice o Directriz).';
        checkBtn.style.display = 'block';
        checkBtn.disabled = true;
        nextBtn.style.display = 'none';

        Array.from(selectionButtons.children).forEach(btn => {
            btn.classList.remove('selected');
            btn.disabled = false;
        });

        draw();
    }

    function handleSelection(type) {
        if (gameOver) return;
        if (quizState !== 'awaiting_selection' && quizState !== 'awaiting_guess') return;
        if (identifiedElements[type]) return; // Ya identificado
        
        selectedPointType = type;
        userGuess = null;
        quizState = 'awaiting_guess';
        
        Array.from(selectionButtons.children).forEach(btn => {
            btn.classList.remove('selected');
        });
        document.querySelector(`button[data-point="${type}"]`).classList.add('selected');

        const typeNames = { 'focus': 'Foco', 'vertex': 'Vértice', 'directrix': 'Directriz' };
        statusMessage.className = 'status-message';
        statusMessage.textContent = `¡Seleccionado! Ahora haz clic en el canvas para marcar la ubicación del ${typeNames[type]}.`;
        checkBtn.disabled = true;
        draw();
    }

    function handleCanvasClick(e) {
        if (gameOver) return;
        if (quizState !== 'awaiting_guess' || !selectedPointType) return;

        const rect = canvas.getBoundingClientRect();
        const canvasX = e.clientX - rect.left;
        const canvasY = e.clientY - rect.top;
        const worldCoords = canvasToWorld(canvasX, canvasY);

        userGuess = {
            worldX: parseFloat(worldCoords.x.toFixed(1)),
            worldY: parseFloat(worldCoords.y.toFixed(1)),
            canvasX,
            canvasY
        };

        statusMessage.textContent = `Marca en (${userGuess.worldX.toFixed(1)}, ${userGuess.worldY.toFixed(1)}). Presiona "Comprobar".`;
        checkBtn.disabled = false;
        draw();
    }

    function checkGuess() {
        if (gameOver) return;
        if (quizState !== 'awaiting_guess' || !userGuess) return;

        score.attempts++;
        updateScore();
        quizState = 'result';
        checkBtn.disabled = true;

        const target = currentParabola[selectedPointType];
        
        let isCorrect = false;

        if (selectedPointType === 'directrix') {
             const targetCanvas = worldToCanvas(target.axis === 'y' ? target.value : 0, target.axis === 'x' ? target.value : 0);
             
             if (target.axis === 'x') {
                 const targetCanvasY = targetCanvas.y;
                 if (Math.abs(userGuess.canvasY - targetCanvasY) <= tolerance) {
                     isCorrect = true;
                 }
             } else {
                 const targetCanvasX = targetCanvas.x;
                 if (Math.abs(userGuess.canvasX - targetCanvasX) <= tolerance) {
                     isCorrect = true;
                 }
             }
        } else {
            const targetCanvas = worldToCanvas(target.x, target.y);
            const distance = Math.hypot(userGuess.canvasX - targetCanvas.x, userGuess.canvasY - targetCanvas.y);
            if (distance <= tolerance) {
                isCorrect = true;
            }
        }
        
        userGuess.isCorrect = isCorrect;
        Array.from(selectionButtons.children).forEach(btn => btn.disabled = true);

        const typeNames = { 'focus': 'Foco', 'vertex': 'Vértice', 'directrix': 'Directriz' };

        if (isCorrect) {
            identifiedElements[selectedPointType] = true;
            updateProgressIndicator();
            statusMessage.className = 'status-message correct';
            statusMessage.textContent = `✓ ¡Correcto! Has identificado el ${typeNames[selectedPointType]} correctamente.`;
            
            // Revisar si todos los elementos están identificados
            const allCompleted = Object.values(identifiedElements).every(v => v);
            
            if (allCompleted) {
                // RONDA COMPLETADA
                score.correct++;
                addTime(10); // Agregar 10 segundos
                statusMessage.textContent += ` ¡Ronda completada! +10 segundos.`;
                updateScore();
                setTimeout(() => {
                    nextBtn.style.display = 'block';
                    checkBtn.style.display = 'none';
                }, 800);
            } else {
                // Pasar al siguiente elemento
                setTimeout(() => {
                    moveToNextElement();
                }, 1500);
            }
        } else {
            statusMessage.className = 'status-message incorrect';
            
            let labelText = '';
            if (selectedPointType === 'directrix') {
                if (target.axis === 'x') labelText = `y = ${target.value.toFixed(1)}`;
                else labelText = `x = ${target.value.toFixed(1)}`;
            } else {
                labelText = `(${target.x.toFixed(1)}, ${target.y.toFixed(1)})`;
            }
            
            statusMessage.textContent = `✗ Incorrecto. El ${typeNames[selectedPointType]} real está en ${labelText}. Intenta de nuevo.`;
            
            setTimeout(() => {
                quizState = 'awaiting_selection';
                userGuess = null;
                selectedPointType = null;
                checkBtn.disabled = true;
                Array.from(selectionButtons.children).forEach(btn => {
                    btn.classList.remove('selected');
                    btn.disabled = false;
                });
                statusMessage.textContent = 'Selecciona nuevamente el elemento.';
                draw();
            }, 2000);
        }

        draw();
    }

    // --- Event Listeners ---
    selectionButtons.addEventListener('click', e => {
        if (e.target.tagName === 'BUTTON') {
            handleSelection(e.target.dataset.point);
        }
    });

    canvas.addEventListener('click', handleCanvasClick);
    checkBtn.addEventListener('click', checkGuess);
    nextBtn.addEventListener('click', startNewRound);

    // Initial load
    resizeCanvas();
    initElementsState();
    startNewRound();
    startTimer();
  </script>
</body>
</html>
